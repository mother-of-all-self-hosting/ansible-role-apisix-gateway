---
# The `apisix_gateway_*` -> `apisix_*` rename is caught in
# tasks/validate_config_deprecations.yml, which tasks/main.yml includes
# regardless of whether the role is enabled. Every variable this role has ever
# had carried the old prefix, including the ones deprecated before the rename,
# so there is nothing left for a list of individual renames to catch here.

- name: Fail if required APISIX settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item.name }}`).
  when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
  with_items:
    - { "name": "apisix_identifier", "when": true }
    - { "name": "apisix_uid", "when": true }
    - { "name": "apisix_gid", "when": true }
    - { "name": "apisix_hostname", "when": true }
    - { "name": "apisix_path_prefix", "when": true }
    - { "name": "apisix_container_network", "when": true }
    - { "name": "apisix_container_labels_admin_hostname", "when": "{{ apisix_container_labels_admin_enabled }}" }
    - { "name": "apisix_container_labels_control_hostname", "when": "{{ apisix_container_labels_control_enabled }}" }
    - { "name": "apisix_container_labels_metrics_hostname", "when": "{{ apisix_container_labels_metrics_enabled }}" }

# We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
# Knowing that `apisix_path_prefix` does not end with a slash
# ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
- name: Fail if apisix_path_prefix ends with a slash
  ansible.builtin.fail:
    msg: >-
      apisix_path_prefix (`{{ apisix_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/apisix`).
  when: "apisix_path_prefix != '/' and apisix_path_prefix[-1] == '/'"
