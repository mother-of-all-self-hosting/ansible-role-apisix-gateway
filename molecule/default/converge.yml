---
- name: Include roles for APISIX Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for APISIX Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - ansible-role-etcd
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure APISIX service is started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: apisix_defaults

    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure etcd systemd service is started
      ansible.builtin.systemd_service:
        name: etcd.service
        state: started

    - name: Ensure APISIX systemd service is started
      ansible.builtin.systemd_service:
        name: "{{ apisix_defaults.apisix_identifier }}.service"
        state: started
