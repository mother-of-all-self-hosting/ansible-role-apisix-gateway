---
# Project source code URL: https://github.com/apache/apisix

apisix_enabled: true

# Deliberately still `apisix-gateway`, even though the role and its variables
# are now called `apisix`. This value names the container, the container
# network, the systemd service and the base path, and it is the stem of every
# Traefik router, service and middleware name in `../templates/labels.j2`.
# Changing it would not rename any of those on an existing installation - it
# would create a second set beside them and leave the old container, unit and
# network running and unmanaged, with two APISIX instances answering for the
# same hostname. Renaming the variables costs a user one edit of vars.yml;
# renaming this value would cost them a manual cleanup on every server.
apisix_identifier: apisix-gateway
apisix_base_path: "/{{ apisix_identifier }}"
apisix_config_path: "{{ apisix_base_path }}/config"

# This must stay a bare three-part version - `apisix_container_image_tag`
# appends `-debian` to it. apache/apisix publishes no bare version tags, so
# .github/renovate.json additionally tells Renovate to extract the version out
# of the `-debian` tags; that part cannot be spelled out in this annotation.
# renovate: datasource=docker depName=apache/apisix versioning=semver
apisix_version: 3.18.0

apisix_uid: ""
apisix_gid: ""

# The scheme used for serving APISIX API gateway.
apisix_scheme: https

# The hostname at which APISIX serves its API gateway.
apisix_hostname: ""

# The path at which APISIX serves its API gateway.
# This value must either be `/` or not end with a slash (e.g. `/apisix`).
apisix_path_prefix: /

apisix_container_image: "{{ apisix_container_image_registry_prefix }}apache/apisix:{{ apisix_container_image_tag }}"
apisix_container_image_tag: "{{ apisix_version }}-debian"
apisix_container_image_registry_prefix: "{{ apisix_container_image_registry_prefix_upstream }}"
apisix_container_image_registry_prefix_upstream: "{{ apisix_container_image_registry_prefix_upstream_default }}"
apisix_container_image_registry_prefix_upstream_default: docker.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
apisix_container_network: "{{ apisix_identifier }}"

# Control if the container network is deleted on uninstalling.
apisix_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port for the gateway service.
#
# Related to `apisix_config_apisix_node_listen`
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:9080"), just a port number or an empty string to not expose.
apisix_container_gateway_http_bind_port: ""

# Specify how the container publishes its HTTP port for the control service.
#
# Related to `apisix_config_apisix_control_port` and `apisix_config_apisix_enable_control`
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:9092"), just a port number or an empty string to not expose.
apisix_container_control_http_bind_port: ""

# Specify how the container publishes its HTTP port for the admin service.
#
# Related to `apisix_config_deployment_admin_admin_listen_port`.
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:9180"), just a port number or an empty string to not expose.
apisix_container_admin_http_bind_port: ""

# Specify how the container publishes its HTTP port for the admin service.
#
# Related to `apisix_config_plugin_attr_prometheus_export_addr_port`.
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:9091"), just a port number or an empty string to not expose.
apisix_container_metrics_http_bind_port: ""

# Contains the hostname of the container
apisix_container_hostname: "{{ apisix_hostname }}"

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
apisix_container_additional_networks: "{{ apisix_container_additional_networks_auto + apisix_container_additional_networks_custom }}"
apisix_container_additional_networks_auto: []
apisix_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
apisix_container_additional_volumes: "{{ apisix_container_additional_volumes_auto + apisix_container_additional_volumes_custom }}"
apisix_container_additional_volumes_auto: []
apisix_container_additional_volumes_custom: []

# apisix_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `apisix_container_labels_additional_labels_custom`.
apisix_container_labels_traefik_enabled: true
apisix_container_labels_traefik_docker_network: "{{ apisix_container_network }}"
apisix_container_labels_traefik_entrypoints: web-secure
apisix_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls if labels are added to expose the Gateway API publicly.
apisix_container_labels_gateway_enabled: true
apisix_container_labels_gateway_hostname: "{{ apisix_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/apisix`).
apisix_container_labels_gateway_path_prefix: "{{ apisix_path_prefix }}"
apisix_container_labels_gateway_rule: "Host(`{{ apisix_container_labels_gateway_hostname }}`){% if apisix_container_labels_gateway_path_prefix != '/' %} && PathPrefix(`{{ apisix_container_labels_gateway_path_prefix }}`){% endif %}"
apisix_container_labels_gateway_priority: 0
apisix_container_labels_gateway_entrypoints: "{{ apisix_container_labels_traefik_entrypoints }}"
apisix_container_labels_gateway_middlewares: []
apisix_container_labels_gateway_tls: "{{ apisix_container_labels_gateway_entrypoints != 'web' }}"
apisix_container_labels_gateway_tls_certResolver: "{{ apisix_container_labels_traefik_tls_certResolver }}"  # noqa var-naming

# Controls if labels are added to expose the Admin API publicly.
# This API is protected with a key (see `apisix_config_deployment_admin_admin_key`),
# so exposing it publicly should be safe.
apisix_container_labels_admin_enabled: false
apisix_container_labels_admin_hostname: ""
# The path prefix must either be `/` or not end with a slash (e.g. `/apisix`).
apisix_container_labels_admin_path_prefix: /
apisix_container_labels_admin_rule: "Host(`{{ apisix_container_labels_admin_hostname }}`){% if apisix_container_labels_admin_path_prefix != '/' %} && PathPrefix(`{{ apisix_container_labels_admin_path_prefix }}`){% endif %}"
apisix_container_labels_admin_priority: 0
apisix_container_labels_admin_entrypoints: "{{ apisix_container_labels_traefik_entrypoints }}"
apisix_container_labels_admin_middlewares: []
apisix_container_labels_admin_tls: "{{ apisix_container_labels_admin_entrypoints != 'web' }}"
apisix_container_labels_admin_tls_certResolver: "{{ apisix_container_labels_traefik_tls_certResolver }}"  # noqa var-naming

# Controls if labels are added to expose the Control API publicly.
# This API has no authentication/authorization mechanisms, so enabling it publicly is not safe.
apisix_container_labels_control_enabled: false
apisix_container_labels_control_hostname: ""
# The path prefix must either be `/` or not end with a slash (e.g. `/apisix`).
apisix_container_labels_control_path_prefix: /
apisix_container_labels_control_rule: "Host(`{{ apisix_container_labels_control_hostname }}`){% if apisix_container_labels_control_path_prefix != '/' %} && PathPrefix(`{{ apisix_container_labels_control_path_prefix }}`){% endif %}"
apisix_container_labels_control_priority: 0
apisix_container_labels_control_entrypoints: "{{ apisix_container_labels_traefik_entrypoints }}"
apisix_container_labels_control_middlewares: []
apisix_container_labels_control_tls: "{{ apisix_container_labels_control_entrypoints != 'web' }}"
apisix_container_labels_control_tls_certResolver: "{{ apisix_container_labels_traefik_tls_certResolver }}"  # noqa var-naming

# Controls if labels are added to expose the Prometheus metrics publicly.
# Related to: `apisix_config_plugin_attr_prometheus_*`
apisix_container_labels_metrics_enabled: true
apisix_container_labels_metrics_hostname: "{{ apisix_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/apisix`).
apisix_container_labels_metrics_path_prefix: /metrics
apisix_container_labels_metrics_rule: "Host(`{{ apisix_container_labels_metrics_hostname }}`){% if apisix_container_labels_metrics_path_prefix != '/' %} && PathPrefix(`{{ apisix_container_labels_metrics_path_prefix }}`){% endif %}"
apisix_container_labels_metrics_priority: 0
apisix_container_labels_metrics_entrypoints: "{{ apisix_container_labels_traefik_entrypoints }}"
apisix_container_labels_metrics_middlewares: []
apisix_container_labels_metrics_tls: "{{ apisix_container_labels_metrics_entrypoints != 'web' }}"
apisix_container_labels_metrics_tls_certResolver: "{{ apisix_container_labels_traefik_tls_certResolver }}"  # noqa var-naming
apisix_container_labels_metrics_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
apisix_container_labels_metrics_middleware_basic_auth_users: ""

# apisix_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `apisix_container_labels_additional_labels_custom`
#
# Example:
# apisix_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
apisix_container_labels_additional_labels: "{{ apisix_container_labels_additional_labels_auto + apisix_container_labels_additional_labels_custom }}"
apisix_container_labels_additional_labels_auto: []
apisix_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
apisix_container_extra_arguments: "{{ apisix_container_extra_arguments_auto + apisix_container_extra_arguments_custom }}"
apisix_container_extra_arguments_auto: []
apisix_container_extra_arguments_custom: []

# List of systemd services that the APISIX systemd service depends on
apisix_systemd_required_services_list: "{{ apisix_systemd_required_services_list_default + apisix_systemd_required_services_list_auto + apisix_systemd_required_services_list_custom }}"
apisix_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
apisix_systemd_required_services_list_auto: []
apisix_systemd_required_services_list_custom: []

# List of systemd services that the APISIX systemd service wants
apisix_systemd_wanted_services_list: "{{ apisix_systemd_wanted_services_list_default + apisix_systemd_wanted_services_list_auto + apisix_systemd_wanted_services_list_custom }}"
apisix_systemd_wanted_services_list_default: []
apisix_systemd_wanted_services_list_auto: []
apisix_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
apisix_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
apisix_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
apisix_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
apisix_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ apisix_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ apisix_container_stop_grace_time_seconds }} {{ apisix_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ apisix_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ apisix_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ apisix_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ apisix_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ apisix_identifier }} after {{ apisix_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
apisix_environment_variables_tz: UTC

# Controls the `apisix.node_listen` configuration property
apisix_config_apisix_node_listen: 9080

# Controls the `apisix.enable_ipv6` configuration property
apisix_config_apisix_enable_ipv6: false

# Controls the `apisix.enable_control` configuration property
apisix_config_apisix_enable_control: false

# Controls the `apisix.control.ip` configuration property
apisix_config_apisix_control_ip: '0.0.0.0'

# Controls the `apisix.control.port` configuration property
apisix_config_apisix_control_port: 9092

# Controls the `apisix.deployment.admin.admin_listen.ip` configuration property.
# See: https://apisix.apache.org/docs/apisix/admin-api/
apisix_config_deployment_admin_admin_listen_ip: '0.0.0.0'

# Controls the `apisix.deployment.admin.admin_listen.port` configuration property.
# See: https://apisix.apache.org/docs/apisix/admin-api/
apisix_config_deployment_admin_admin_listen_port: 9180

# Controls the `apisix.deployment.admin.allow_admin` configuration property.
# It should contain whitelisted IP addresses that can reach the admin panel.
#
# When fronting with a reverse-proxy, this cannot be used,
# as it matches against the IP address of the reverse-proxy,
# not the forwarded client IP address.
#
# See: https://apisix.apache.org/docs/apisix/admin-api/
# See: https://nginx.org/en/docs/http/ngx_http_access_module.html#allow
apisix_config_deployment_admin_allow_admin: ['0.0.0.0/0']

# Controls the `apisix.deployment.admin.admin_key_required` configuration property.
# Related to `apisix_config_deployment_admin_admin_key`.
apisix_config_deployment_admin_admin_key_required: true

# Controls the `apisix.deployment.admin.admin_key` configuration property.
# Related to: `apisix_config_deployment_admin_admin_key_required`
# It should contain a list of objects for defining access.
# See: https://apisix.apache.org/docs/apisix/admin-api/
#
# Example:
# apisix_config_deployment_admin_admin_key:
#   - name: admin_username
#     key: API_KEY_SECRET
#     role: admin
#   - name: viewer_username
#     key: API_KEY_SECRET
#     role: viewer
apisix_config_deployment_admin_admin_key: []

# Controls the `apisix.deployment.admin.enable_admin_cors` configuration property.
# Enable Admin API CORS response header `Access-Control-Allow-Origin`.
apisix_config_deployment_admin_enable_admin_cors: true

# Controls the `apisix.deployment.admin.enable_admin_ui` configuration property.
#
# Since APISIX 3.13, the APISIX Dashboard ships inside the `apache/apisix`
# image itself instead of being released separately, and APISIX's own nginx
# serves it at `/ui/`. `true` (which is also APISIX's own default, kept here so
# that this role does not change the behavior of the image) serves it; `false`
# makes `/ui/` return a 404.
#
# The UI is served from inside the Admin API's `server` block, so it shares
# that listener's port (`apisix_config_deployment_admin_admin_listen_port`)
# and its `apisix_config_deployment_admin_allow_admin` allowlist.
# Making the UI reachable makes the Admin API reachable. The Admin API is
# protected by `apisix_config_deployment_admin_admin_key`; the UI is
# static files with no authentication of its own. See the README for how to
# reach it without publishing it to the world.
apisix_config_deployment_admin_enable_admin_ui: true

# Controls the `apisix.deployment.etcd.host` configuration property.
# This should contain at least one (but possibly multiple URLs) pointing to an same etcd cluster.
apisix_config_deployment_etcd_host: []

# Controls the `apisix.deployment.etcd.prefix` configuration property.
# It specifies APISIX's prefix in etcd.
apisix_config_deployment_etcd_prefix: /apisix

# Controls the `apisix.deployment.etcd.timeout` configuration property.
# Timeout value (in seconds) for connecting to the etcd cluster.
apisix_config_deployment_etcd_timeout: 30

# Controls the `apisix.deployment.etcd.user` configuration property.
apisix_config_deployment_etcd_user: ""

# Controls the `apisix.deployment.etcd.password` configuration property.
apisix_config_deployment_etcd_password: ""

# Controls the `plugin_attr.prometheus.export_addr.ip` configuration property.
apisix_config_plugin_attr_prometheus_export_addr_ip: '0.0.0.0'

# Controls the `plugin_attr.prometheus.export_addr.port` configuration property.
apisix_config_plugin_attr_prometheus_export_addr_port: 9091

# Controls the `plugin_attr.prometheus.export_uri` configuration property.
#
# This is the internal metrics path. If exposing via Traefik, this doesn't matter,
# as metrics are served according to `apisix_container_labels_metrics_path_prefix`.
apisix_config_plugin_attr_prometheus_export_uri: /apisix/prometheus/metrics

# Default APISIX configuration template which covers the generic use case.
# You can customize it by controlling the various variables inside it.
#
# For a more advanced customization, you can extend the default (see `apisix_config_extension_yaml`)
# or completely replace this variable with your own template.
apisix_config_yaml: "{{ lookup('template', 'templates/config.yaml.j2') }}"

apisix_config_extension_yaml: |
  # Your custom YAML configuration for APISIX goes here.
  # This configuration extends the default starting configuration (`apisix_config_yaml`).
  #
  # You can override individual variables from the default configuration, or introduce new ones.
  #
  # If you need something more special, you can take full control by
  # completely redefining `apisix_config_yaml`.
  #
  # Example configuration extension follows:
  #
  # apisix:
  #   enable_admin_cors: false

apisix_config_extension: "{{ apisix_config_extension_yaml | from_yaml if apisix_config_extension_yaml | from_yaml is mapping else {} }}"

# Holds the final APISIX configuration (a combination of the default and its extension).
# You most likely don't need to touch this variable. Instead, see `apisix_config_yaml`.
apisix_config: "{{ apisix_config_yaml | from_yaml | combine(apisix_config_extension, recursive=True) }}"

# Additional environment variables.
apisix_environment_variables_additional_variables: ""
